<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Noah's Learning Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2a33; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(circle at 15% 0%, #fff6da 0%, #fdf0e6 35%, #eaf6ff 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
  }

  .sky-shape { position: fixed; border-radius: 50%; opacity: 0.35; z-index: 0; pointer-events: none; }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 20px 16px 50px; }

  header.hero { text-align: center; margin-bottom: 18px; }
  .hero h1 {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: clamp(26px, 7.5vw, 42px); margin: 0 0 4px; letter-spacing: 0.2px;
  }
  .hero h1 .noah {
    background: linear-gradient(90deg, #1c7ed6, #ae3ec9, #e8590c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hero .greeting {
    font-size: clamp(14.5px, 3.6vw, 17px); font-weight: 700; color: #5c5a68; margin: 0 0 2px;
  }
  .hero .stars {
    font-size: 13.5px; font-weight: 700; color: #b8860b; margin-top: 4px;
  }

  /* HOME SCREEN */
  #screen-home { display: block; }
  .home-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
  }
  .tile {
    position: relative;
    border: none; border-radius: 22px; padding: 18px 14px 16px;
    color: #fff; text-align: left; cursor: pointer;
    font-family: 'Baloo 2', sans-serif;
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    min-height: 118px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .tile .tile-emoji { font-size: 30px; }
  .tile .tile-name { font-size: 17px; font-weight: 700; margin-top: 6px; line-height: 1.15; }
  .tile .tile-sub { font-family: 'Quicksand', sans-serif; font-size: 12px; font-weight: 600; opacity: 0.92; margin-top: 4px; }
  .tile .tile-badge {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,255,255,0.28); border-radius: 999px;
    font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 700;
    padding: 3px 8px;
  }

  .surprise-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: none; border-radius: 999px; padding: 14px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; color: #fff;
    background: linear-gradient(90deg, #ff922b, #e8590c);
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    cursor: pointer; margin-bottom: 6px;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .surprise-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }

  .clear-btn {
    display: block; margin: 14px auto 0; background: none; border: none;
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px;
    color: #a39fae; text-decoration: underline; cursor: pointer; padding: 6px;
  }
  .clear-btn:active { color: #7a7686; }

  /* This Week tile */
  .week-tile {
    display: flex; align-items: center; gap: 12px; width: 100%;
    border: none; border-radius: 18px; padding: 14px 16px; margin-bottom: 12px;
    background: linear-gradient(90deg, #0c8599, #0b7285);
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    cursor: pointer; text-align: left;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .week-tile:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .week-tile-emoji { font-size: 26px; flex: 0 0 auto; }
  .week-tile-text { flex: 1 1 auto; display: flex; flex-direction: column; }
  .week-tile-title { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; color: #fff; }
  .week-tile-sub { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.9); margin-top: 2px; }
  .week-tile-go { font-size: 22px; color: #fff; flex: 0 0 auto; }
  .map-tile { background: linear-gradient(90deg, #7c3aed, #6d28d9); text-decoration: none; }
  .reads-tile { background: linear-gradient(90deg, #e8590c, #9d174d); text-decoration: none; display: flex; }

  /* Weekly updates screen */
  #screen-weekly { display: none; }
  .week-list { display: flex; flex-direction: column; gap: 12px; }
  .week-item {
    display: flex; align-items: center; gap: 12px;
    background: #ffffff; border: 3px solid #0c8599; border-radius: 20px;
    padding: 14px 16px; cursor: pointer;
    box-shadow: 0 4px 0 #0c8599;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .week-item:active { transform: translateY(3px); box-shadow: 0 1px 0 #0c8599; }
  .week-item .icon {
    width: 48px; height: 48px; border-radius: 14px; background: #0c8599;
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex: 0 0 auto;
  }
  .week-item .text { flex: 1 1 auto; }
  .week-item .wname { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16.5px; color: #0b7285; display: block; }
  .week-item .wdesc { font-size: 12.5px; font-weight: 600; color: #6b6975; display: block; }
  .week-item .go { font-size: 20px; color: #0c8599; }

  /* Modal pop-up */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,20,30,0.55);
    z-index: 50; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-card {
    background: #fffaf0; border-radius: 22px; max-width: 480px; width: 100%;
    max-height: 85vh; overflow-y: auto; padding: 22px 20px 24px; position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px;
    border-radius: 50%; border: none; background: #f0f0f0; font-size: 16px; cursor: pointer;
  }
  .modal-card h2 { font-family: 'Baloo 2', sans-serif; color: #0b7285; margin: 0 0 2px; font-size: 21px; }
  .modal-card .mdate { font-size: 13px; font-weight: 700; color: #8a8894; margin-bottom: 14px; }
  .modal-card h3 { font-family: 'Baloo 2', sans-serif; font-size: 14.5px; color: #1c7ed6; margin: 16px 0 6px; border-bottom: 2px solid #dfe4ea; padding-bottom: 3px; }
  .modal-card .mrow { margin-bottom: 8px; font-size: 14px; line-height: 1.45; }
  .modal-card .mrow strong { color: #232323; }
  .modal-card .mphoto { margin: 10px 0 14px; } .modal-card .mphoto img { width: 100%; height: auto; border-radius: 12px; border: 3px solid #dfe4ea; display: block; } .modal-card .mphoto figcaption { font-size: 12.5px; font-weight: 700; color: #6b6975; margin-top: 4px; }
  .modal-card .mnote { background: #fff4e0; border-left: 4px solid #e8590c; padding: 8px 12px; border-radius: 4px; font-size: 12.5px; font-weight: 600; color: #7a5b00; margin-top: 12px; }
  .modal-card .mclosing { font-size: 13px; font-style: italic; color: #6b6975; margin-top: 14px; }


  /* SUBJECT SCREEN */
  #screen-subject { display: none; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #ffffff; border: 2px solid #e2e2ea; border-radius: 999px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink);
    padding: 8px 16px; margin-bottom: 14px; cursor: pointer;
  }
  .back-btn:active { transform: scale(0.96); }

  .panel-head {
    display: flex; align-items: center; gap: 12px; color: #fff;
    border-radius: 18px; padding: 14px 18px; margin-bottom: 16px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
  }
  .panel-head .emoji { font-size: 30px; }
  .panel-head h2 { font-family: 'Baloo 2', sans-serif; margin: 0; font-size: 22px; font-weight: 700; }
  .panel-head p { margin: 2px 0 0; font-size: 13.5px; font-weight: 600; opacity: 0.92; }

  .site-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

  .site-card {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    background: #ffffff; border: 3px solid var(--card-color, #ccc); border-radius: 20px;
    padding: 13px 14px; box-shadow: 0 4px 0 var(--card-color, #ccc);
    cursor: pointer; transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .site-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-color, #ccc); }
  .site-card:focus-visible { outline: 3px solid #333; outline-offset: 2px; }

  .site-card .icon {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: 14px;
    background: var(--card-color, #ccc); display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .site-card .text { flex: 1 1 auto; min-width: 0; }
  .site-card .name {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16.5px; margin: 0;
    display: block; color: var(--card-color, var(--ink));
  }
  .site-card .desc { margin: 0; display: block; font-size: 12.5px; font-weight: 600; color: #6b6975; }

  .site-link {
    flex: 1 1 auto; display: flex; align-items: center; gap: 12px;
    min-width: 0; text-decoration: none; color: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .site-link:focus-visible { outline: 3px solid #333; outline-offset: 2px; }

  .speak-btn {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; border: none;
    background: #f3f3f7; font-size: 17px; cursor: pointer;
  }
  .speak-btn:active { transform: scale(0.9); }

  .go-link { flex: 0 0 auto; font-size: 20px; color: var(--card-color, #ccc); text-decoration: none; }

  .visited-star {
    position: absolute; top: -8px; left: -8px; font-size: 20px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }

  .note-card {
    background: #fff9e6; border: 3px dashed #f0b429; border-radius: 18px;
    padding: 16px 18px; font-weight: 600; font-size: 14.5px; color: #7a5b00; text-align: center;
  }

  footer { text-align: center; margin-top: 26px; font-size: 13px; font-weight: 600; color: #8a8894; }

  @media (min-width: 460px) {
    .home-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 520px) {
    .site-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

<div class="sky-shape" style="width:220px;height:220px;background:#ffe3a3;top:-60px;left:-60px;"></div>
<div class="sky-shape" style="width:160px;height:160px;background:#bfe3ff;top:120px;right:-50px;"></div>
<div class="sky-shape" style="width:140px;height:140px;background:#ffd0e0;bottom:60px;left:-40px;"></div>

<div class="wrap">

  <header class="hero">
    <h1><span class="noah">Noah's</span> Learning Adventure</h1>
    <p class="greeting" id="greeting">Pick a subject to get started!</p>
    <p class="stars" id="starCount"></p>
  </header>

  <!-- HOME SCREEN -->
  <div id="screen-home">
    <div class="home-grid" id="homeGrid"></div>
    <button class="week-tile" id="weekTile">
      <span class="week-tile-emoji">🗓️</span>
      <span class="week-tile-text">
        <span class="week-tile-title">This Week at School</span>
        <span class="week-tile-sub" id="weekTileSub">See what Noah's been learning + homework</span>
      </span>
      <span class="week-tile-go">›</span>
    </button>
    <button class="week-tile map-tile" id="mapBtn">
      <span class="week-tile-emoji">📋</span>
      <span class="week-tile-text">
        <span class="week-tile-title">Curriculum Map</span>
        <span class="week-tile-sub">The full Year 1 curriculum map (PDF)</span>
      </span>
      <span class="week-tile-go">›</span>
    </button>
    <a class="week-tile reads-tile" href="noah_year1_reads.html">
      <span class="week-tile-emoji">📚</span>
      <span class="week-tile-text">
        <span class="week-tile-title">Reading List</span>
        <span class="week-tile-sub">50 Year 1 books to tick off</span>
      </span>
      <span class="week-tile-go">›</span>
    </a>
    <button class="surprise-btn" id="surpriseBtn">🎲 Surprise me!</button>
    <button class="clear-btn" id="clearBtn">↺ Clear my stars</button>
  </div>

  <!-- SUBJECT SCREEN -->
  <div id="screen-subject">
    <button class="back-btn" id="backBtn">‹ All subjects</button>
    <div class="panel-head" id="panelHead">
      <span class="emoji" id="panelEmoji"></span>
      <div><h2 id="panelName"></h2><p id="panelBlurb"></p></div>
    </div>
    <div class="site-grid" id="siteGrid"></div>
    <div class="note-card" id="panelNote" style="display:none; margin-top:12px;"></div>
  </div>

  <!-- WEEKLY UPDATES SCREEN -->
  <div id="screen-weekly">
    <button class="back-btn" id="backBtnWeekly">‹ All subjects</button>
    <div class="panel-head" style="--panel-color:#0c8599; background:#0c8599;">
      <span class="emoji">🗓️</span>
      <div><h2>This Week at School</h2><p>Tap a week to read the full update</p></div>
    </div>
    <div class="week-list" id="weekList"></div>
  </div>

  <!-- POP-UP MODAL FOR A SINGLE WEEK -->
  <div id="weekModalOverlay" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer>Ask a grown-up before you go online 🌟</footer>
</div>

  function openEmbeddedPDF(base64, filename) {
    try {
      const byteChars = atob(base64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    } catch (e) {
      alert('Sorry, could not open the PDF.');
    }
  }

  // ---- Visited tracking (per-device, best-effort) ----
  const STORAGE_KEY = 'noahLearningVisited';
  function getVisited() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function markVisited(key) {
    try {
      const v = getVisited();
      if (!v.includes(key)) { v.push(key); localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); }
    } catch (e) { /* storage unavailable, ignore */ }
    renderStarCount();
  }
  function isVisited(key) { return getVisited().includes(key); }
  function visitKey(subjectId, url) { return subjectId + '::' + url; }

  function allSites() {
    return SUBJECTS.flatMap(s => s.sites.filter(site => !site.pdf).map(site => ({ ...site, subjectId: s.id, subjectColor: s.color, key: visitKey(s.id, site.url) })));
  }

  function renderStarCount() {
    const total = allSites().length;
    const visited = allSites().filter(s => isVisited(s.key)).length;
    const el = document.getElementById('starCount');
    el.textContent = visited > 0 ? `⭐ ${visited} of ${total} websites explored!` : '';
  }

  // ---- Greeting ----
  function setGreeting() {
    const h = new Date().getHours();
    let g = 'Ready to learn, Noah?';
    if (h < 12) g = 'Good morning, Noah! Ready to learn?';
    else if (h < 17) g = 'Good afternoon, Noah! Pick a subject!';
    else g = 'Good evening, Noah! One more go?';
    document.getElementById('greeting').textContent = g;
  }

  // ---- Speech ----
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }

  // ---- Render home grid ----
  function renderHome() {
    const grid = document.getElementById('homeGrid');
    grid.innerHTML = '';
    SUBJECTS.forEach(s => {
      const visitedCount = s.sites.filter(site => isVisited(visitKey(s.id, site.url))).length;
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.style.background = s.color;
      tile.innerHTML = `
        ${visitedCount > 0 ? `<span class="tile-badge">⭐ ${visitedCount}</span>` : ''}
        <span class="tile-emoji">${s.emoji}</span>
        <span class="tile-name">${s.tileName || s.name}</span>
        <span class="tile-sub">${s.sites.filter(x => !x.pdf).length} website${s.sites.filter(x => !x.pdf).length > 1 ? 's' : ''}</span>
      `;
      tile.addEventListener('click', () => showSubject(s.id));
      grid.appendChild(tile);
    });
  }

  // ---- Render subject screen ----
  function showSubject(id) {
    const s = SUBJECTS.find(x => x.id === id);
    if (!s) return;
    document.getElementById('screen-home').style.display = 'none';
    document.getElementById('screen-subject').style.display = 'block';

    const head = document.getElementById('panelHead');
    head.style.background = s.color;
    document.getElementById('panelEmoji').textContent = s.emoji;
    document.getElementById('panelName').textContent = s.name;
    document.getElementById('panelBlurb').textContent = s.blurb;

    const grid = document.getElementById('siteGrid');
    grid.innerHTML = '';
    s.sites.forEach(site => {
      const card = document.createElement('div');
      card.className = 'site-card';
      card.style.setProperty('--card-color', s.color);
      const key = visitKey(id, site.url);
      card.innerHTML = `
        ${isVisited(key) ? '<span class="visited-star">⭐</span>' : ''}
        <a class="site-link" href="${site.url}" target="_blank" rel="noopener">
          <span class="icon">${site.icon}</span>
          <span class="text"><span class="name">${site.name}</span><span class="desc">${site.desc}</span></span>
        </a>
        <button class="speak-btn" aria-label="Hear this website name" title="Hear this">🔊</button>
        <a class="go-link" href="${site.url}" target="_blank" rel="noopener" aria-hidden="true" tabindex="-1">›</a>
      `;
      card.querySelectorAll('.site-link, .go-link').forEach(a => {
        if (site.pdf) {
          a.removeAttribute('target');
          a.addEventListener('click', (e) => {
            e.preventDefault();
            openEmbeddedPDF(MATHS_SUMMARY_PDF_B64, 'Noah_KS1_Maths_Summary.pdf');
          });
          return;
        }
        a.addEventListener('click', () => {
          markVisited(key);
          setTimeout(() => showSubject(id), 150);
        });
      });
      card.querySelector('.speak-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        speak(site.name);
      });
      grid.appendChild(card);
    });

    const noteEl = document.getElementById('panelNote');
    if (s.note) { noteEl.style.display = 'block'; noteEl.textContent = s.note; }
    else { noteEl.style.display = 'none'; }
  }

  function showHome() {
    document.getElementById('screen-subject').style.display = 'none';
    document.getElementById('screen-weekly').style.display = 'none';
    document.getElementById('screen-home').style.display = 'block';
    renderHome();
  }

  document.getElementById('backBtn').addEventListener('click', showHome);
  document.getElementById('backBtnWeekly').addEventListener('click', showHome);

  // ---- This Week at School ----
  function renderWeekTileSub() {
    const sub = document.getElementById('weekTileSub');
    if (WEEKLY_UPDATES.length === 0) {
      sub.textContent = 'No updates yet';
    } else {
      sub.textContent = `Latest: ${WEEKLY_UPDATES[WEEKLY_UPDATES.length - 1].date}`;
    }
  }

  function showWeekly() {
    document.getElementById('screen-home').style.display = 'none';
    document.getElementById('screen-subject').style.display = 'none';
    document.getElementById('screen-weekly').style.display = 'block';
    renderWeekList();
  }

  function renderWeekList() {
    const list = document.getElementById('weekList');
    list.innerHTML = '';
    // Newest first
    const ordered = [...WEEKLY_UPDATES].reverse();
    if (ordered.length === 0) {
      list.innerHTML = '<div class="note-card">No weekly updates added yet. Ask a grown-up to add this week\'s homework!</div>';
      return;
    }
    ordered.forEach(week => {
      const item = document.createElement('div');
      item.className = 'week-item';
      item.innerHTML = `
        <span class="icon">🗓️</span>
        <span class="text">
          <span class="wname">${week.date}</span>
          <span class="wdesc">${week.greeting || 'Tap to read this week\'s update'}</span>
        </span>
        <span class="go">›</span>
      `;
      item.addEventListener('click', () => openWeekModal(week.id));
      list.appendChild(item);
    });
  }

  function openWeekModal(id) {
    const week = WEEKLY_UPDATES.find(w => w.id === id);
    if (!week) return;
    const content = document.getElementById('modalContent');
    let html = `<h2>${week.greeting || 'This Week'}</h2><div class="mdate">${week.date}</div>`;
    if (week.summary && week.summary.length) {
      html += `<h3>Our week in Year 1</h3>`;
      week.summary.forEach(row => {
        html += `<div class="mrow"><strong>${row.subject}:</strong> ${row.text}</div>`;
      });
    }
    if (week.homework && week.homework.length) {
      html += `<h3>Homework</h3>`;
      week.homework.forEach(row => {
        html += `<div class="mrow"><strong>${row.subject}:</strong> ${row.text}</div>`;
      });
    }
    if (week.photos && week.photos.length) {
      html += `<h3>Noah's work ✅</h3>`;
      week.photos.forEach(ph => {
        html += `<figure class="mphoto"><img src="${NOAH_WORK_IMGS[ph.img]}" alt="${ph.caption}"><figcaption>${ph.caption}</figcaption></figure>`;
      });
    }
    if (week.note) {
      html += `<div class="mnote">${week.note}</div>`;
    }
    if (week.closing) {
      html += `<div class="mclosing">${week.closing}</div>`;
    }
    content.innerHTML = html;
    document.getElementById('weekModalOverlay').classList.add('active');
  }

  function closeWeekModal() {
    document.getElementById('weekModalOverlay').classList.remove('active');
  }

  document.getElementById('weekTile').addEventListener('click', showWeekly);
  document.getElementById('mapBtn').addEventListener('click', () => openEmbeddedPDF(NOAH_MAP_PDF_B64, 'Noah_Year1_Curriculum_Map.pdf'));
  document.getElementById('modalClose').addEventListener('click', closeWeekModal);
  document.getElementById('weekModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'weekModalOverlay') closeWeekModal();
  });

  document.getElementById('surpriseBtn').addEventListener('click', () => {
    const sites = allSites();
    const pick = sites[Math.floor(Math.random() * sites.length)];
    markVisited(pick.key);
    const a = document.createElement('a');
    a.href = pick.url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    renderHome();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    const ok = window.confirm('Clear all of Noah\'s stars? This can\'t be undone.');
    if (!ok) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    renderStarCount();
    renderHome();
  });

  setGreeting();
  renderStarCount();
  renderHome();
  renderWeekTileSub();
</script>

</body>
</html>
