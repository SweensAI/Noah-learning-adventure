<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Noah's Learning Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2a33; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(circle at 15% 0%, #fff6da 0%, #fdf0e6 35%, #eaf6ff 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
  }

  .sky-shape { position: fixed; border-radius: 50%; opacity: 0.35; z-index: 0; pointer-events: none; }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 20px 16px 50px; }

  header.hero { text-align: center; margin-bottom: 18px; }
  .hero h1 {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: clamp(26px, 7.5vw, 42px); margin: 0 0 4px; letter-spacing: 0.2px;
  }
  .hero h1 .noah {
    background: linear-gradient(90deg, #1c7ed6, #ae3ec9, #e8590c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hero .greeting {
    font-size: clamp(14.5px, 3.6vw, 17px); font-weight: 700; color: #5c5a68; margin: 0 0 2px;
  }
  .hero .stars {
    font-size: 13.5px; font-weight: 700; color: #b8860b; margin-top: 4px;
  }

  /* HOME SCREEN */
  #screen-home { display: block; }
  .home-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
  }
  .tile {
    position: relative;
    border: none; border-radius: 22px; padding: 18px 14px 16px;
    color: #fff; text-align: left; cursor: pointer;
    font-family: 'Baloo 2', sans-serif;
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    min-height: 118px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .tile .tile-emoji { font-size: 30px; }
  .tile .tile-name { font-size: 17px; font-weight: 700; margin-top: 6px; line-height: 1.15; }
  .tile .tile-sub { font-family: 'Quicksand', sans-serif; font-size: 12px; font-weight: 600; opacity: 0.92; margin-top: 4px; }
  .tile .tile-badge {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,255,255,0.28); border-radius: 999px;
    font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 700;
    padding: 3px 8px;
  }

  .surprise-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: none; border-radius: 999px; padding: 14px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; color: #fff;
    background: linear-gradient(90deg, #ff922b, #e8590c);
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    cursor: pointer; margin-bottom: 6px;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .surprise-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }

  .clear-btn {
    display: block; margin: 14px auto 0; background: none; border: none;
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px;
    color: #a39fae; text-decoration: underline; cursor: pointer; padding: 6px;
  }
  .clear-btn:active { color: #7a7686; }

  /* SUBJECT SCREEN */
  #screen-subject { display: none; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #ffffff; border: 2px solid #e2e2ea; border-radius: 999px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink);
    padding: 8px 16px; margin-bottom: 14px; cursor: pointer;
  }
  .back-btn:active { transform: scale(0.96); }

  .panel-head {
    display: flex; align-items: center; gap: 12px; color: #fff;
    border-radius: 18px; padding: 14px 18px; margin-bottom: 16px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
  }
  .panel-head .emoji { font-size: 30px; }
  .panel-head h2 { font-family: 'Baloo 2', sans-serif; margin: 0; font-size: 22px; font-weight: 700; }
  .panel-head p { margin: 2px 0 0; font-size: 13.5px; font-weight: 600; opacity: 0.92; }

  .site-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

  .site-card {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    background: #ffffff; border: 3px solid var(--card-color, #ccc); border-radius: 20px;
    padding: 13px 14px; box-shadow: 0 4px 0 var(--card-color, #ccc);
    cursor: pointer; transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .site-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-color, #ccc); }
  .site-card:focus-visible { outline: 3px solid #333; outline-offset: 2px; }

  .site-card .icon {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: 14px;
    background: var(--card-color, #ccc); display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .site-card .text { flex: 1 1 auto; min-width: 0; }
  .site-card .name {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16.5px; margin: 0;
    display: block; color: var(--card-color, var(--ink));
  }
  .site-card .desc { margin: 0; display: block; font-size: 12.5px; font-weight: 600; color: #6b6975; }

  .site-link {
    flex: 1 1 auto; display: flex; align-items: center; gap: 12px;
    min-width: 0; text-decoration: none; color: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .site-link:focus-visible { outline: 3px solid #333; outline-offset: 2px; }

  .speak-btn {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; border: none;
    background: #f3f3f7; font-size: 17px; cursor: pointer;
  }
  .speak-btn:active { transform: scale(0.9); }

  .go-link { flex: 0 0 auto; font-size: 20px; color: var(--card-color, #ccc); text-decoration: none; }

  .visited-star {
    position: absolute; top: -8px; left: -8px; font-size: 20px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }

  .note-card {
    background: #fff9e6; border: 3px dashed #f0b429; border-radius: 18px;
    padding: 16px 18px; font-weight: 600; font-size: 14.5px; color: #7a5b00; text-align: center;
  }

  footer { text-align: center; margin-top: 26px; font-size: 13px; font-weight: 600; color: #8a8894; }

  @media (min-width: 460px) {
    .home-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 520px) {
    .site-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="sky-shape" style="width:220px;height:220px;background:#ffe3a3;top:-60px;left:-60px;"></div>
<div class="sky-shape" style="width:160px;height:160px;background:#bfe3ff;top:120px;right:-50px;"></div>
<div class="sky-shape" style="width:140px;height:140px;background:#ffd0e0;bottom:60px;left:-40px;"></div>

<div class="wrap">

  <header class="hero">
    <h1><span class="noah">Noah's</span> Learning Adventure</h1>
    <p class="greeting" id="greeting">Pick a subject to get started!</p>
    <p class="stars" id="starCount"></p>
  </header>

  <!-- HOME SCREEN -->
  <div id="screen-home">
    <div class="home-grid" id="homeGrid"></div>
    <button class="surprise-btn" id="surpriseBtn">🎲 Surprise me!</button>
    <button class="clear-btn" id="clearBtn">↺ Clear my stars</button>
  </div>

  <!-- SUBJECT SCREEN -->
  <div id="screen-subject">
    <button class="back-btn" id="backBtn">‹ All subjects</button>
    <div class="panel-head" id="panelHead">
      <span class="emoji" id="panelEmoji"></span>
      <div><h2 id="panelName"></h2><p id="panelBlurb"></p></div>
    </div>
    <div class="site-grid" id="siteGrid"></div>
    <div class="note-card" id="panelNote" style="display:none; margin-top:12px;"></div>
  </div>

  <footer>Ask a grown-up before you go online 🌟</footer>
</div>

<script>
  const SUBJECTS = [
    { id: 'english', name: 'English', emoji: '📖', color: '#1c7ed6', blurb: 'Reading, phonics and writing games',
      sites: [
        { name: 'BBC Bitesize KS1', url: 'https://www.bbc.co.uk/bitesize/levels/z3g4d2p', desc: 'Videos, games and quizzes', icon: '📺' },
        { name: 'Phonics Play', url: 'https://www.phonicsplay.co.uk/', desc: 'Sound and letter games', icon: '🔤' },
        { name: 'Starfall', url: 'https://www.starfall.com/', desc: 'Colourful reading games', icon: '⭐' },
        { name: 'ictgames Literacy', url: 'https://www.ictgames.com/mobilePage/literacy.html', desc: 'Letters, words and spelling', icon: '🎮' },
        { name: 'Oxford Owl', url: 'https://home.oxfordowl.co.uk/', desc: 'Free storybooks to read', icon: '📚' }
      ]
    },
    { id: 'maths', name: 'Maths', emoji: '🔢', color: '#9c36b5', blurb: 'Number, counting and shape games',
      sites: [
        { name: 'BBC Bitesize KS1', url: 'https://www.bbc.co.uk/bitesize/levels/z3g4d2p', desc: 'Maths videos and quizzes', icon: '📺' },
        { name: 'Topmarks Maths Games', url: 'https://www.topmarks.co.uk/maths-games/5-7-years/counting', desc: 'Counting and number fun', icon: '🧮' },
        { name: 'Hit the Button', url: 'https://www.topmarks.co.uk/maths-games/hit-the-button', desc: 'Fast number bonds game', icon: '🎯' }
      ]
    },
    { id: 'science', name: 'Science', emoji: '🔬', color: '#2f9e44', blurb: 'Animals, plants and materials',
      sites: [
        { name: 'BBC Bitesize KS1 Science', url: 'https://www.bbc.co.uk/bitesize/subjects/z6svr82', desc: 'Videos and quizzes', icon: '📺' },
        { name: 'Crickweb Science', url: 'http://www.crickweb.co.uk/ks1science.html', desc: 'Fun science games', icon: '🧪' },
        { name: 'Science Kids', url: 'https://www.sciencekids.co.nz/', desc: 'Experiments and facts', icon: '🐛' }
      ]
    },
    { id: 'humanities', name: 'History & Geography', tileName: 'History & Geo', emoji: '🗺️', color: '#e8590c', blurb: 'Maps, the past, and explorers',
      sites: [
        { name: 'BBC Bitesize KS1', url: 'https://www.bbc.co.uk/bitesize/levels/z3g4d2p', desc: 'History & geography topics', icon: '📺' }
      ]
    },
    { id: 'computing', name: 'Computing', emoji: '💻', color: '#0c8599', blurb: 'Coding and computer skills',
      sites: [
        { name: 'Code.org', url: 'https://code.org/', desc: 'Fun drag-and-drop coding', icon: '🧩' }
      ]
    },
    { id: 'more', name: 'More Subjects', tileName: 'More', emoji: '✨', color: '#ae3ec9', blurb: 'RE, PE, Music, Art & Design, RHE',
      sites: [
        { name: 'BBC Bitesize KS1', url: 'https://www.bbc.co.uk/bitesize/levels/z3g4d2p', desc: 'Covers lots of other subjects too', icon: '📺' }
      ],
      note: '🧑‍🤝‍🧑 Ask a grown-up if you\'d like to find more websites for these subjects!'
    }
  ];

  // ---- Visited tracking (per-device, best-effort) ----
  const STORAGE_KEY = 'noahLearningVisited';
  function getVisited() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function markVisited(key) {
    try {
      const v = getVisited();
      if (!v.includes(key)) { v.push(key); localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); }
    } catch (e) { /* storage unavailable, ignore */ }
    renderStarCount();
  }
  function isVisited(key) { return getVisited().includes(key); }
  function visitKey(subjectId, url) { return subjectId + '::' + url; }

  function allSites() {
    return SUBJECTS.flatMap(s => s.sites.map(site => ({ ...site, subjectId: s.id, subjectColor: s.color, key: visitKey(s.id, site.url) })));
  }

  function renderStarCount() {
    const total = allSites().length;
    const visited = allSites().filter(s => isVisited(s.key)).length;
    const el = document.getElementById('starCount');
    el.textContent = visited > 0 ? `⭐ ${visited} of ${total} websites explored!` : '';
  }

  // ---- Greeting ----
  function setGreeting() {
    const h = new Date().getHours();
    let g = 'Ready to learn, Noah?';
    if (h < 12) g = 'Good morning, Noah! Ready to learn?';
    else if (h < 17) g = 'Good afternoon, Noah! Pick a subject!';
    else g = 'Good evening, Noah! One more go?';
    document.getElementById('greeting').textContent = g;
  }

  // ---- Speech ----
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }

  // ---- Render home grid ----
  function renderHome() {
    const grid = document.getElementById('homeGrid');
    grid.innerHTML = '';
    SUBJECTS.forEach(s => {
      const visitedCount = s.sites.filter(site => isVisited(visitKey(s.id, site.url))).length;
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.style.background = s.color;
      tile.innerHTML = `
        ${visitedCount > 0 ? `<span class="tile-badge">⭐ ${visitedCount}</span>` : ''}
        <span class="tile-emoji">${s.emoji}</span>
        <span class="tile-name">${s.tileName || s.name}</span>
        <span class="tile-sub">${s.sites.length} website${s.sites.length > 1 ? 's' : ''}</span>
      `;
      tile.addEventListener('click', () => showSubject(s.id));
      grid.appendChild(tile);
    });
  }

  // ---- Render subject screen ----
  function showSubject(id) {
    const s = SUBJECTS.find(x => x.id === id);
    if (!s) return;
    document.getElementById('screen-home').style.display = 'none';
    document.getElementById('screen-subject').style.display = 'block';

    const head = document.getElementById('panelHead');
    head.style.background = s.color;
    document.getElementById('panelEmoji').textContent = s.emoji;
    document.getElementById('panelName').textContent = s.name;
    document.getElementById('panelBlurb').textContent = s.blurb;

    const grid = document.getElementById('siteGrid');
    grid.innerHTML = '';
    s.sites.forEach(site => {
      const card = document.createElement('div');
      card.className = 'site-card';
      card.style.setProperty('--card-color', s.color);
      const key = visitKey(id, site.url);
      card.innerHTML = `
        ${isVisited(key) ? '<span class="visited-star">⭐</span>' : ''}
        <a class="site-link" href="${site.url}" target="_blank" rel="noopener">
          <span class="icon">${site.icon}</span>
          <span class="text"><span class="name">${site.name}</span><span class="desc">${site.desc}</span></span>
        </a>
        <button class="speak-btn" aria-label="Hear this website name" title="Hear this">🔊</button>
        <a class="go-link" href="${site.url}" target="_blank" rel="noopener" aria-hidden="true" tabindex="-1">›</a>
      `;
      card.querySelectorAll('.site-link, .go-link').forEach(a => {
        a.addEventListener('click', () => {
          markVisited(key);
          setTimeout(() => showSubject(id), 150);
        });
      });
      card.querySelector('.speak-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        speak(site.name);
      });
      grid.appendChild(card);
    });

    const noteEl = document.getElementById('panelNote');
    if (s.note) { noteEl.style.display = 'block'; noteEl.textContent = s.note; }
    else { noteEl.style.display = 'none'; }
  }

  function showHome() {
    document.getElementById('screen-subject').style.display = 'none';
    document.getElementById('screen-home').style.display = 'block';
    renderHome();
  }

  document.getElementById('backBtn').addEventListener('click', showHome);

  document.getElementById('surpriseBtn').addEventListener('click', () => {
    const sites = allSites();
    const pick = sites[Math.floor(Math.random() * sites.length)];
    markVisited(pick.key);
    const a = document.createElement('a');
    a.href = pick.url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    renderHome();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    const ok = window.confirm('Clear all of Noah\'s stars? This can\'t be undone.');
    if (!ok) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    renderStarCount();
    renderHome();
  });

  setGreeting();
  renderStarCount();
  renderHome();
</script>

</body>
</html>
